{% set name = "anaconda-channel-guide" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Private repo: cannot fetch the tarball via the usual public HTTPS GitHub archive URL
  git_url: https://github.com/anaconda/{{ name }}.git
  git_tag: v{{ version }}

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - git
  host:
    - python
    - pip
    - hatchling >=1.12.2
    - hatch-vcs >=0.2.0
  run:
    - python
    - conda
    - requests
    - anaconda-auth >=0.15.1
    - conda-anaconda-tos

test:
  source_files:
    - tests
  imports:
    - anaconda_channel_guide
    - anaconda_channel_guide.plugin
    - anaconda_channel_guide.box
    - anaconda_channel_guide.hooks
  requires:
    - pip
    - pytest
    - pytest-mock
    - conda
  commands:
    - pip check
    - python -c "from anaconda_channel_guide import __version__; assert __version__ == \"{{ version }}\""
    - python -c "from importlib.metadata import version; assert version('{{ name }}') == '{{ version }}'"
    - pytest -v tests

about:
  home: https://github.com/anaconda/anaconda-channel-guide
  summary: Conda plugin that guides users to main-x channel packages
  description: |
    A plug-in that checks whether a package is available on main-x when
    unavailable in other channels.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/anaconda/anaconda-channel-guide

extra:
  recipe-maintainers:
    - Jrice1317
